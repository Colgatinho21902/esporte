<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{background}}"><meta name="description" content="{{subtitle}}">
<meta property="og:title" content="{{pageTitle}}"><meta property="og:description" content="{{subtitle}}"><meta property="og:type" content="website">
<title>{{pageTitle}}</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="{{logo}}" imagesrcset="{{logoSmall}} 192w, {{logo}} 384w" imagesizes="(max-height: 600px) 132px, 184px">
<style>:root{--background:{{background}};--accent:{{accent}};--button:{{button}}}</style>
<link rel="stylesheet" href="/style.css"><script src="/config.js" defer></script><script src="/app.js" defer></script>
</head><body>
<main class="stage"><section class="card" aria-labelledby="headline">
<div class="identity"><span class="brand">{{brandTop}} <b>{{brandBottom}}</b></span><span class="sport-label"><span aria-hidden="true"></span> {{nicheLabel}}</span></div>
<div class="portrait"><img src="{{logo}}" srcset="{{logoSmall}} 192w, {{logo}} 384w" sizes="(max-height: 600px) 132px, 184px" width="384" height="384" alt="{{brand}}" fetchpriority="high" decoding="async"><span class="free-badge">{{badgeTop}} <b>{{badgeBottom}}</b></span></div>
<div class="message"><p class="eyebrow">{{eyebrow}}</p><h1 id="headline">{{headline}} <span>{{headlineAccent}}</span></h1><p class="subtitle">{{subtitle}}</p></div>
<div class="conversion"><p class="trust"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>{{trust}}</p>
<a class="cta" id="ctaPrincipal" {{ctaAttributes}} aria-describedby="invite-status"><svg class="whatsapp" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 0C5.4 0 .1 5.4.1 12c0 2.1.5 4.2 1.6 6L0 24l6.2-1.6A12 12 0 0 0 12 24c6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.5ZM12 22a10 10 0 0 1-5.1-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A10 10 0 1 1 12 22Zm5.5-7.4c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.7c.2-.3.2-.4.3-.7.1-.3.1-.5 0-.7l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1-1.1 2.5s1.1 3 1.3 3.2c.2.2 2.2 3.3 5.3 4.6.7.3 1.3.5 1.8.6.7.2 1.4.2 2 .1.6-.1 1.8-.8 2.1-1.5.2-.7.2-1.3.2-1.5-.1-.1-.3-.2-.6-.4Z" fill="currentColor"/></svg><span>{{ctaText}}</span><span class="arrow" aria-hidden="true">↗</span></a>
<p class="invite-status" id="invite-status" role="status">{{status}}</p></div>
<ul class="categories" aria-label="Categorias de achadinhos">{{categories}}</ul><p class="footer">{{footer}}</p>
</section></main></body></html>
